repository: ../TrackNotes
extensions: ['.rb', '.py', '.txt', '.yaml', '.yml', '.sh', '.md', '.toml', '.sql']
db_path: .database/
cache_dir: .cache/
Tools:
  - module: groundcrew.tools
    tools:
      - CodebaseQATool
      - SingleDocstringTool
      - LintFileTool
      - GetFileContentsTool
      - CyclomaticComplexityTool
      - FindUsageTool
      - InstallationAndUseTool
colorscheme: 'gruvbox-dark'
debug: true
